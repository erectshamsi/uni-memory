<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ارجاع به حامی</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">حافظهٔ سازمانی دانشگاه</a><nav><a href="/">بازگشت به گفتگو</a></nav></header><main class="wrap"><section class="hero"><span class="tag">ارجاع به کارشناس</span><h1>پرسش نیازمند بررسی تخصصی است</h1><p>متن آماده را کپی کنید و در سامانهٔ حامی ارسال نمایید. این صفحه ایمیل را خودکار ارسال نمی‌کند.</p></section><section class="panel"><label>متن پیشنهادی پیام</label><textarea id="letter" rows="14"></textarea><div class="row"><button id="copy">کپی متن</button><a class="button" target="_blank" rel="noopener" href="https://mail.iau.ac.ir">ورود به mail.iau.ac.ir</a><a class="button" id="mail" href="#">باز کردن برنامهٔ ایمیل</a></div><p id="status" class="fine"></p></section></main><script>
const p=new URLSearchParams(location.search),q=p.get('q')||'',role=p.get('role')||'مشخص نشده';let ids=[];try{ids=JSON.parse(p.get('docs')||'[]')}catch{};const trace='UM-'+Date.now().toString(36).toUpperCase();(async()=>{let titles=[];try{const r=await fetch('/api/documents');const d=await r.json();titles=(d.documents||[]).filter(x=>ids.includes(x.id)).map(x=>x.title)}catch{}const text=`موضوع: درخواست بررسی کارشناسی\n\nبا سلام،\nلطفاً دربارهٔ پرسش زیر راهنمایی فرمایید. این پرسش برای پاسخ قطعی نیازمند بررسی کارشناس تشخیص داده شده است.\n\nپرسش: ${q}\nمخاطب: ${role}\nمنابع مرتبط (صرفاً برای بررسی): ${titles.join('؛ ')||'منبع تأییدشده‌ای یافت نشد.'}\nکد پیگیری محلی: ${trace}\n\nبا احترام`;document.querySelector('#letter').value=text;document.querySelector('#mail').href='mailto:?subject='+encodeURIComponent('درخواست بررسی کارشناسی '+trace)+'&body='+encodeURIComponent(text)})();document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.querySelector('#letter').value);document.querySelector('#status').textContent='متن کپی شد.'}catch{document.querySelector('#letter').select();document.execCommand('copy');document.querySelector('#status').textContent='متن انتخاب/کپی شد.'}};
</script></body></html>
