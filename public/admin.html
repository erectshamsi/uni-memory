<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>مدیریت منابع | حافظه سازمانی دانشگاه</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap nav">
      <div class="brand">حافظه سازمانی دانشگاه</div>
      <nav class="navlinks">
        <a href="/">صفحه گفتگو</a>
      </nav>
    </div>
  </header>

  <main class="wrap narrow">
    <h1>مدیریت منابع و بخشنامه‌ها</h1>
    <p class="muted">بخشنامه یا منبع جدید را ثبت کنید تا هوش مصنوعی بر اساس آن پاسخ دهد.</p>

    <section class="card form">
      <label>عنوان سند
        <input id="title" placeholder="مثلاً: ارائه درس دانش خانواده در نیمسال اول" />
      </label>

      <label>کد سند
        <input id="code" placeholder="مثلاً: d1997401" />
      </label>

      <label>لینک مستقیم بخشنامه (اختیاری)
        <input id="link" dir="ltr" placeholder="https://ec.iau.ir/..." />
      </label>

      <label>متن بخشنامه
        <textarea id="content" rows="7" placeholder="متن بخشنامه را اینجا وارد کنید..."></textarea>
      </label>

      <div class="grid2">
        <label>وضعیت بررسی
          <select id="status">
            <option value="approved" selected>تأییدشده</option>
            <option value="pending">در انتظار تأیید</option>
          </select>
        </label>
        <label>اعتبار
          <select id="validity">
            <option value="current" selected>معتبر</option>
            <option value="unknown">نامشخص</option>
            <option value="superseded">منسوخ</option>
          </select>
        </label>
      </div>

      <button id="saveBtn">افزودن / ذخیره منبع</button>
      <div id="statusMsg" class="muted"></div>

      <div class="row">
        <button id="refreshBtn" class="secondary">بازخوانی منابع</button>
        <button id="exportBtn" class="secondary">خروجی JSON</button>
        <button id="baleBtn" class="secondary">تنظیم وب‌هوک بله</button>
      </div>

      <div id="docs" class="docs"></div>
    </section>
  </main>

  <script>
    const statusMsg = document.getElementById("statusMsg");
    const docsEl = document.getElementById("docs");
    let currentDocs = [];

    async function loadDocs() {
      const r = await fetch("/api/documents");
      const data = await r.json();
      currentDocs = data.documents || [];
      docsEl.innerHTML = currentDocs.map(d => `
        <div class="doc">
          <div class="doc-head">
            <strong>${escapeHtml(d.title)}</strong>
            <span class="muted">${escapeHtml(d.status)} / ${escapeHtml(d.validity)}</span>
          </div>
          <div class="muted small">${escapeHtml((d.content || "").slice(0, 220))}...</div>
          <div class="doc-actions">
            <button class="secondary" onclick="toggleApprove('${d.id}','${d.status}')">${d.status === "approved" ? "لغو تأیید" : "تأیید"}</button>
            <button class="danger" onclick="removeDoc('${d.id}')">حذف</button>
          </div>
        </div>
      `).join("");
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
    }

    document.getElementById("saveBtn").onclick = async () => {
      const title = document.getElementById("title").value.trim();
      const code = document.getElementById("code").value.trim();
      const link = document.getElementById("link").value.trim();
      const rawContent = document.getElementById("content").value.trim();
      const status = document.getElementById("status").value;
      const validity = document.getElementById("validity").value;

      let finalContent = rawContent;
      if (code) finalContent = `کد سند: ${code}\n` + finalContent;
      if (link) finalContent = finalContent + `\nلینک بخشنامه: ${link}`;

      const r = await fetch("/api/documents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, content: finalContent, status, validity })
      });
      const data = await r.json();
      statusMsg.textContent = r.ok ? "منبع با موفقیت ذخیره شد." : ("خطا: " + (data.error || r.status));
      if (r.ok) {
        document.getElementById("title").value = "";
        document.getElementById("code").value = "";
        document.getElementById("link").value = "";
        document.getElementById("content").value = "";
        loadDocs();
      }
    };

    window.toggleApprove = async (id, status) => {
      await fetch("/api/documents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id, status: status === "approved" ? "pending" : "approved" })
      });
      loadDocs();
    };

    window.removeDoc = async (id) => {
      await fetch("/api/documents?id=" + encodeURIComponent(id), { method: "DELETE" });
      loadDocs();
    };

    document.getElementById("refreshBtn").onclick = loadDocs;
    document.getElementById("exportBtn").onclick = () => {
      const blob = new Blob([JSON.stringify(currentDocs, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "documents.json";
      a.click();
    };

    document.getElementById("baleBtn").onclick = async () => {
      const r = await fetch("/api/setup-bale", { method: "POST" });
      const data = await r.json();
      statusMsg.textContent = data.message || JSON.stringify(data);
    };

    loadDocs();
  </script>
</body>
</html>
