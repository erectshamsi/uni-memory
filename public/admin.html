<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>پنل مدیریت منابع</title><style>body{font-family:tahoma;padding:20px;line-height:1.6}form{max-width:600px;margin:auto;display:flex;flex-direction:column;gap:10px}input,textarea,select{padding:10px;border:1px solid #ccc}button{padding:10px;background:#0056b3;color:#fff;border:none;cursor:pointer}</style></head><body>
<form id="adminForm">
    <h2>مدیریت منابع</h2>
    <input type="password" id="pass" placeholder="رمز مدیریت" required>
    <input type="text" id="title" placeholder="عنوان سند" required>
    <input type="text" id="code" placeholder="کد سند">
    <input type="url" id="link" placeholder="لینک مستقیم بخشنامه در سایت دانشگاه (اختیاری)">
    <textarea id="text" rows="10" placeholder="متن استخراج‌شده"></textarea>
    <select id="status"><option value="تأییدشده">معتبر (تأییدشده)</option><option value="در انتظار">در انتظار</option></select>
    <button type="submit">افزودن / ذخیره منبع</button>
</form>
<hr>
<div style="text-align:center">
    <button onclick="fetch('/api/bale',{method:'POST',headers:{'x-password':document.querySelector('#pass').value}}).then(alert('وب‌هوک ست شد'))">تنظیم وب‌هوک بله</button>
</div>
<script>
document.querySelector('#adminForm').onsubmit=async e=>{e.preventDefault();
let data={password:document.querySelector('#pass').value,title:document.querySelector('#title').value,code:document.querySelector('#code').value,link:document.querySelector('#link').value,text:document.querySelector('#text').value,status:document.querySelector('#status').value};
let r=await fetch('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
alert(r.ok?'با موفقیت ذخیره شد':'خطا: رمز اشتباه است یا مشکلی پیش آمده');
};
</script></body></html>
