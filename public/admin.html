<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت منابع</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">حافظهٔ سازمانی دانشگاه</a><nav><a href="/">گفتگو</a></nav></header><main class="wrap"><section class="hero"><h1>مدیریت منابع</h1><p>برای امنیت و پایداری، این پنل عمومی است و احراز هویت ندارد: آن را خصوصی نگه دارید یا پیش از استفادهٔ واقعی محافظت کنید. فایل‌ها فقط در مرورگر به متن تبدیل می‌شوند.</p></section><section class="panel"><form id="form" class="grid"><label>عنوان سند<input id="title" required></label><label>کد سند<input id="code"></label><label>بارگذاری PDF، DOCX یا TXT<input id="file" type="file" accept=".pdf,.docx,.txt,.md,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label><label>یا متن استخراج‌شده<textarea id="text" required></textarea></label><div class="row"><label>وضعیت بررسی<select id="status"><option value="pending">در انتظار تأیید</option><option value="approved">تأییدشده</option><option value="rejected">ردشده</option></select></label><label>اعتبار<select id="validity"><option value="unknown">نامشخص</option><option value="valid">معتبر</option><option value="expired">منقضی</option><option value="historical">تاریخی</option></select></label></div><button>افزودن / ذخیره منبع</button></form><p id="msg"></p><div class="row"><button id="refresh" type="button">بازخوانی منابع</button><button id="export" type="button">تصدیر JSON</button><button id="bale" type="button">تنظیم وب‌هوک بله</button></div><div id="list"></div></section></main><script>
const $=s=>document.querySelector(s), msg=$('#msg');let docs=[];async function load(){try{let r=await fetch('/api/documents'),d=await r.json();if(!r.ok)throw Error(d.error);docs=d.documents||[];$('#list').replaceChildren();for(const x of docs){let a=document.createElement('article');a.className='citation';let b=document.createElement('b');b.textContent=x.title+' ('+x.status+'، '+x.validity+')';let p=document.createElement('p');p.textContent=(x.pages||[]).map(z=>z.text).join(' ').slice(0,180);let del=document.createElement('button');del.textContent='حذف';del.onclick=()=>mutate({action:'delete',id:x.id});a.append(b,p,del);$('#list').append(a)}msg.textContent='منابع: '+docs.length+'. '+(d.persistent?'خواندن ابری فعال است.':'حالت فایل محلی؛ برای ماندگاری GitHub را تنظیم کنید.')}catch(e){msg.textContent=e.message}}async function mutate(body){try{let r=await fetch('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent=d.warning||'ذخیره شد.';await load()}catch(e){msg.textContent=e.message}}$('#form').onsubmit=async e=>{e.preventDefault();try{const pages=$('#text').value.trim().split(/\f/).map((text,i)=>({page:i+1,text}));await mutate({action:'upsert',document:{title:$('#title').value,doc_code:$('#code').value,status:$('#status').value,validity:$('#validity').value,pages}})}catch(e){msg.textContent=e.message}};$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('#title').value=$('#title').value||f.name.replace(/\.[^.]+$/,'');try{if(/\.(txt|md)$/i.test(f.name))$('#text').value=await f.text();else if(/\.pdf$/i.test(f.name)){const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;let out=[];for(let n=1;n<=pdf.numPages;n++){let page=await pdf.getPage(n),c=await page.getTextContent();out.push(c.items.map(i=>i.str).join(' '))}$('#text').value=out.join('\f')}else if(/\.docx$/i.test(f.name)){const m=await import('https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js');let b=await m.extractRawText({arrayBuffer:await f.arrayBuffer()});$('#text').value=b.value}else throw Error('فرمت فایل پشتیبانی نمی‌شود.')}catch(err){msg.textContent='استخراج ناموفق؛ فایل را به TXT تبدیل و متن را وارد کنید. '+err.message}};$('#refresh').onclick=load;$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(docs,null,2)],{type:'application/json'}));a.download='documents.json';a.click();URL.revokeObjectURL(a.href)};$('#bale').onclick=async()=>{try{let r=await fetch('/api/setup-bale'),d=await r.json();msg.textContent=d.description||d.error||JSON.stringify(d)}catch(e){msg.textContent=e.message}};load();
</script></body></html>
