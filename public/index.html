<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حافظهٔ سازمانی دانشگاه</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="brand" href="/">حافظهٔ سازمانی دانشگاه</a><nav><a href="/admin">مدیریت منابع</a><a href="/hami">ارجاع به حامی</a></nav></header><main class="wrap"><section class="hero"><span class="tag">دستیار مقررات و بخشنامه‌ها</span><h1>سلام، چطور می‌توانم کمک کنم؟</h1><p>پاسخ‌ها بر پایهٔ منابع ثبت‌شده ارائه می‌شوند. پرسش‌های تفسیری به کارشناس ارجاع می‌شود.</p></section><section class="panel"><label for="role">مخاطب</label><select id="role"><option>دانشجو</option><option>استاد</option><option>کارشناس</option><option>مدیر</option></select><form id="form"><textarea id="question" required maxlength="4000" placeholder="پرسش خود را بنویسید…"></textarea><button>دریافت پاسخ</button></form><div id="result" aria-live="polite"></div></section><p class="fine">نمونه‌منابع اولیه نمایشی و تأییدنشده‌اند. پاسخ سامانه جایگزین بخشنامهٔ معتبر یا نظر کارشناس نیست.</p></main><script>
const form=document.querySelector('#form'), result=document.querySelector('#result');form.onsubmit=async e=>{e.preventDefault();result.innerHTML='<p>در حال بررسی منابع…</p>';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value,role:document.querySelector('#role').value})});let d=await r.json();if(!r.ok)throw Error(d.error||'خطا');result.replaceChildren();let p=document.createElement('p');p.textContent=d.answer;result.append(p);if(d.mode==='expert'){let b=document.createElement('strong');b.className='warning';b.textContent='⚠️ نیازمند بررسی و پاسخ کارشناس';result.append(b);let a=document.createElement('a');a.className='button';a.textContent='ارسال پرسش به حامی';a.href='/hami?q='+encodeURIComponent(document.querySelector('#question').value)+'&role='+encodeURIComponent(document.querySelector('#role').value)+'&docs='+encodeURIComponent(JSON.stringify(d.citations.map(c=>c.id)));result.append(a)}let h=document.createElement('h3');h.textContent='منابع مرتبط';result.append(h);if(!d.citations.length){let x=document.createElement('p');x.textContent='منبع مرتبطی یافت نشد.';result.append(x)}for(const c of d.citations){let box=document.createElement('article');box.className='citation';let t=document.createElement('b');t.textContent=c.title+' — '+c.status+' — صفحه '+c.page;let q=document.createElement('p');q.textContent='«'+c.quote+'»';box.append(t,q);result.append(box)}}catch(err){result.textContent=err.message}};
</script></body></html>
